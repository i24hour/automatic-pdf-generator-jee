version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r backend/requirements.txt
      - apt-get install -y texlive-full 2>/dev/null || true
run:
  command: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
  env:
    - name: PORT
      value: "8080"
