steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/mentors-mantra-base:latest',
      '-f', 'Dockerfile.base',
      '.'
    ]
    dir: 'backend'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/mentors-mantra-base:latest']
images:
  - 'gcr.io/$PROJECT_ID/mentors-mantra-base:latest'
