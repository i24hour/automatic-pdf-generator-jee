steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/mentors-mantra-api', '.']
    dir: 'backend'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/mentors-mantra-api']
    dir: 'backend'

  # Deploy container to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'mentors-mantra-api'
    - '--image'
    - 'gcr.io/$PROJECT_ID/mentors-mantra-api'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    dir: 'backend'

images:
- 'gcr.io/$PROJECT_ID/mentors-mantra-api'

options:
  logging: CLOUD_LOGGING_ONLY
